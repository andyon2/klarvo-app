name: bindings-drift

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings-drift:
    name: xtask generate-bindings + git diff --exit-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build deps
        # Required to compile the windows shell (tauri/webkit2gtk stack) on
        # Ubuntu CI. Version matches Tauri v2 upstream recommendation.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: xtask-generate-bindings

      - name: Regenerate TS bindings
        run: cargo run -q -p xtask -- generate-bindings

      - name: Assert no drift in shells/windows/src/bindings/
        run: |
          if ! git diff --exit-code -- shells/windows/src/bindings/; then
            echo "::error::Generated TypeScript bindings drifted from committed file."
            echo "::error::Run \`cargo xtask generate-bindings\` locally and commit the result."
            exit 1
          fi
