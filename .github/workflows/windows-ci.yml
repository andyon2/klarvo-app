name: windows-compile (G6)

# Scope: Phase-2-A Story 2.A.E1 — Windows-Compile-CI-Gate.
# Verifies that the Tauri shell (klarvo-windows-shell) and the rest of the
# workspace compile on windows-latest. No tests run here — test gates are
# covered by the existing Epic-5 CI on Linux.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-compile:
    name: cargo check --workspace (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml in the repo pins the channel; this action honors it.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: windows-compile-g6

      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets
