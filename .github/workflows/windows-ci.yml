name: windows-compile (G6)

# Scope: Phase-2-A Story 2.A.E1 — Windows-Compile-CI-Gate.
# Verifies that the Tauri shell (klarvo-windows-shell) and the rest of the
# workspace compile on windows-latest. No tests run here — test gates are
# covered by the existing Epic-5 CI on Linux.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-compile:
    name: cargo check --workspace (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90  # Extended for whisper.cpp first-build; cached on 2nd run
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml in the repo pins the channel; this action honors it.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: windows-compile-g6-v2

      - name: cargo check --workspace --all-targets (excl. whisper-local C++ build)
        # klarvo-plugin-whisper-local excluded: whisper-rs compiles whisper.cpp C++ (~15 min
        # first build). Checked separately below with extended timeout.
        run: cargo check --workspace --all-targets --exclude klarvo-plugin-whisper-local

      - name: cargo check -p klarvo-plugin-whisper-local (whisper-rs C++ build; cached on 2nd run)
        # First run: ~15 min C++ compile. Subsequent runs: <1 min from rust-cache.
        run: cargo check -p klarvo-plugin-whisper-local
        timeout-minutes: 30

      - name: cargo clippy klarvo-windows-shell (default features)
        # Story 5.5: disallowed_methods lint-gate (AC-E.5)
        run: cargo clippy -p klarvo-windows-shell -- -D warnings

      - name: cargo clippy klarvo-windows-shell (dev-plain-keystore)
        # Story 5.5: dev-plain-keystore feature activates keystore.rs make_keystore()
        run: cargo clippy -p klarvo-windows-shell --features dev-plain-keystore -- -D warnings
