[workspace]
resolver = "3"
members = [
    "klarvo-core",
    "klarvo-audio-cpal",
    "klarvo-plugins/klarvo-plugin-groq",
    "klarvo-plugins/klarvo-plugin-deepseek",
    "klarvo-plugins/klarvo-plugin-verbatim",
    "klarvo-plugins/klarvo-plugin-chat",
    "klarvo-plugins/klarvo-plugin-polished",
    "klarvo-plugins/klarvo-plugin-clipboard",
    "klarvo-plugins/klarvo-plugin-keystroke",
    "klarvo-plugins/klarvo-plugin-vad-silero",
    "klarvo-bridge-jni",
    "klarvo-test-fixtures",
    "shells/windows/src-tauri",
    "klarvo-shell-orchestrator",
    "xtask",
]
exclude = [
    "src-tauri",
    "android",
    "node_modules",
    "dist",
    "target",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
# klarvo-audio-cpal: AC-pinned versions (cpal 0.15, rubato 0.16); newer major
# versions (0.17, 2.0) carry API breaks incompatible with the Story-2.5 AC.
cpal = "0.15"
rubato = "0.16"
# v1→v2 import (ADR-0004). rusqlite bundled so builds don't depend on system libsqlite3.
rusqlite = { version = "0.39", features = ["bundled"] }
# Secret wrapper for API-keys in the v1-import bundle (redacts Debug/Display, prevents accidental serialization leaks).
secrecy = "0.10"
# Tauri v2 + codegen. tauri-specta/specta RC pinned per ADR-0002.
tauri = { version = "2", default-features = false }
tauri-build = { version = "2", default-features = false }
tauri-plugin-global-shortcut = "2.3.1"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
specta-typescript = "=0.0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
