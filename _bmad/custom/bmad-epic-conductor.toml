#    pre-test for "looks like the SOLL"; it HARD-HALTS for frontend stories with no framework)
#    and GATE-4 smoke already rules. No CI ⇒ trace is an overridable LLM verdict, not a block.
#  - Pre-building this into the SHARED, non-git-tracked global conductor skill = speculative
#    optionality with no concrete consumer (violates code-simplicity + spirit of Epic-4's
#    "don't touch the global conductor"). Wire it the day a logic epic actually needs it.
#
# WHAT REAL WIRING MUST FIRST SOLVE (found by the 2026-06-26 critics — solve these, with a
# concrete logic story to test against, BEFORE editing the global skill):
#  1. atdd→dev COMPOSITION: atdd writes scaffolds to _bmad-output/test-artifacts/ (an output
#     dir), NOT the src/test tree; dev-story authors its own tests (Steps 5-6) and never runs
#     atdd's. "red before dev, dev makes it green" is NOT automatic — the scaffolds must be
#     ported into the real suite, or the value is nil.
#  2. PLACEMENT: epic-conductor spawns each Phase-B story at startStage=dev (create ran in
