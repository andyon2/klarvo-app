#  4. NO SELF-ATTESTED RED: don't have the atdd worker merely *claim* its tests run red
#     (Epic-4 anti-pattern); the conductor/reviewer observes red itself.
#  5. trace recording + trace-FAIL fix budget need their own channel/counter (don't abuse
#     decisions[]; don't collide with maxFixRounds).
# atdd       = false
# trace_gate = false
