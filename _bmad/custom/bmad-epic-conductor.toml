# Conductor contract for THIS project.
#
# Read EXPLICITLY by the global bmad-epic-conductor / bmad-story-conductor skills
# at activation. This is orchestration MECHANICS, not code-derived testing rules:
# it lives here on purpose because (a) `bmad-generate-project-context` owns and may
# regenerate `project-context.md` and cannot reproduce this policy from a code scan,
# and (b) only the conductor reads it — the dev/review workers never needed it.
# `_bmad/custom/` is never touched by the generator, so a dropped run-guard line
# can no longer break run-isolation silently.
#
# Worker-facing testing POSTURE (rendering-oracle anti-pattern, surface-DoD,
# KlarvoTheme regeneration) stays in project-context.md where the workers load it.

env_flag = "BMAD_CONDUCTOR"  # exported =1 for the whole run

[smoke]
# The UNATTENDED-producible proxy surface and how to drive it (GATE-4 + E7).
command       = "scripts/android-smoke.sh"   # build / install / drive-to-state / capture
proxy_surface = "headless Android emulator via scripts/android-emulator.sh — install --abi arm64-v8a so the arm64-only Rust .so runs via the x86_64 image's native-bridge"
evidence_dir  = "_bmad-output/implementation-artifacts/gate4-evidence"
# The real target is NOT unattended-producible — never an automated-run target:
real_target   = "the real Xiaomi/HyperOS device: its install confirmation needs a finger, so it stays Andi's BATCHED visual gate only — never an automated-run target. CORRECTION 2026-08-12 (Story 11-6 GATE-4): the DEBUG_SET_STATE harness is NOT dead on HyperOS — that claim was wrong and misroutes debugging. It failed because DebugHarnessReceiver was declared in no manifest: the declaring app/src/debug/AndroidManifest.xml lived only in the gitignored gen/android tree that 'tauri android init' regenerates. With the manifest restored it drives the real device fine; the restoration is volatile for the same reason. See docs/backlog.md."

[desktop_build]
# Der Windows-Release-Build — die REALE Desktop-Zielfläche, agenten-anstoßbar seit 2026-08-19.
# Vorher hat jeder Agent die Kette von Hand improvisiert und Schritt 1 (pushen) vergessen,
# worauf der Laptop still den alten Stand baute.
command  = "scripts/windows-build.sh"   # [<ref>] [--clean] [--skip-npm]; default = aktueller Branch
topology = "powerhouse hat kein Windows. sync-and-build.ps1 baut auf dem LAPTOP und robocopiert aus DESSEN WSL-Checkout nach D:\\apps\\klarvo. Der Code muss also erst ueber origin dorthin. windows-build.sh macht pushen + auschecken + bauen zu EINEM Schritt und beweist die Frische (exe muss juenger sein als der gebaute Commit)."
transport = "ssh laptop landet direkt in dessen WSL-Ubuntu (kein wsl-Wrapper). powershell.exe steht in einer nicht-interaktiven SSH-Sitzung NICHT im PATH — nur der absolute Pfad /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe funktioniert."
duration = "Minuten bis eine knappe halbe Stunde. IMMER im Hintergrund starten, nie im Vordergrund."
exit_codes = "0 = frisch gebaut | 1 = Vorbedingung verletzt (dreckiger Baum, SHA-Drift, ungepushte Commits auf dem Laptop) | 2 = Compiler-Fehler | 3 = exe aelter als der Commit (cargo hat ein altes Objekt wiederverwendet -> mit --clean wiederholen)"
# Was der Build NICHT entscheidet — dieselbe Grenze wie beim Emulator:
decides    = "dass der Code auf Windows uebersetzt, bindet und startet. Das ist eine echte Aussage, die weder cargo check noch der Chromium-Proxy liefern."
not_decides = "Pixel und Aesthetik. Schriftrasterung und die Windows-Textskalierungs-Drift bleiben Andis Blick auf dem echten Bildschirm. Ein gruener Build ist KEIN Design-Gate."

[run_guard]
# Mechanical run-isolation (Naht 2 + Naht 4): lock + HEAD-watch + real-target detach.
command              = "scripts/conductor-guard.sh"  # subcommands: acquire / release / expect <sha> / check-head / break
detaches_real_target = true
# BMAD_CONDUCTOR=1 forces android-smoke.sh to the emulator and hard-rejects any non-emulator target —
# this is why an unattended run physically cannot install onto the real phone.
# Emulator lifecycle = RUN lifecycle: `conductor-guard.sh release` also runs
# `android-emulator.sh stop` (the run owns the warm test surface, so run-end kills
# it). The TTL watchdog inside android-emulator.sh (default 120min) is only the
# BACKSTOP for crashed/lock-less runs — release is the clean prompt path. Added
# 2026-06-17 after an orphaned klarvo-emu reparented to init pegged ~8 cores.
stops_emulator_on_release = true

[visual_oracle]
# Two layers — the GATE-4 posture for surface stories (Naht 5).
structural        = true   # the emulator IS a reliable STRUCTURAL oracle
structural_method = "adb shell dumpsys window windows — assert overlay-window structure: count of APPLICATION_OVERLAY windows + their requested sizes / gravity / visibility (e.g. recording state = panel ~1080x525 bottom + idle bubble 162x162). A wrong window count/size is a real FAILED smoke, caught without a screenshot."
pixel             = false  # NOT a pixel / aesthetic oracle
pixel_note        = "stock Android (no HyperOS skin), software GPU, and system dialogs can force-hide overlays (mForceHideNonSystemOverlayWindow); on 2026-06-15 an emulator screenshot looked 'green' while the real Xiaomi was visibly broken. The pixel/aesthetic verdict is Andi's real-device gate, never an emulator screenshot."

[tea]
# DEFERRED INTENT MARKER — NOT wired. Both flags are OFF and the story-conductor does NOT
# read them today (the 2026-06-26 wiring into the global skill was built, adversarially
# reviewed, and REVERTED). This block only records the decision + what real wiring requires,
# so the next session doesn't re-improvise it. See memory:
