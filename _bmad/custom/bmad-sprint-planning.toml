# Native routing hook for bmad-sprint-planning (BMAD 6.13; consumed via persistent_facts).
# Vor der 6.13-Migration (2026-09-19) lag diese Directive in bmad-sprint-status.toml; der
# Status-Leser heisst in 6.13 bmad-sprint-planning (Intent `status`).
# Lean directive only (R4/R7): Sperre + next action, parked list, trap.
# Nothing that memory or project-context already carries (no gates, build recipes, residual pointers).
# Append-only: the resolver concatenates this onto the base persistent_facts.
[workflow]

persistent_facts = [
  "SPERRE (Andi-Entscheidung 2026-09-19): Auf klarvo NIE den Intent `sprint-planning`/`generate` und NIE den Intent `fix` fahren -- auch nicht headless. sprint-status.yaml wird von Hand gepflegt. Grund: sprint_plan.py generate verwirft 69 von 106 Keys als Orphans (54 davon done, Epic 13 komplett), weil klarvos Epic-Dateien die Bindestrich-Form `Story 13-1` nutzen und den Epics 10-13 die `## Epic N:`-Zeile fehlt. Erlaubt sind nur `status`, `validate` und `readiness`. Verlangt jemand generate: ablehnen, diesen Grund nennen, auf Hand-Nachtrag verweisen. Arbeit ohne Epic-Zugehoerigkeit hat ihre Heimat in docs/backlog.md.",
  "ROUTING (2026-09-17 abends, Epic 13 GESCHNITTEN = ADR-0016 Amendment 4 + Nachtrag; Skill-Namen 2026-09-19 auf BMAD 6.13 umgestellt): Die Script-Empfehlung von `status` (feste Prioritaet) gilt hier NICHT -- sie landet blind auf 9-8 oder 8-3. NAECHSTE AKTION nur auf Andis Go = Story 13-1 (Debug-Testanbieter, H+-Enabler) aus _bmad-output/planning-artifacts/epics-parity-line-audit-2.md bauen: bmad-build (beaufsichtigt) oder /bmad-conductor (bmad-build-auto); die Story-Spec entsteht im Planungsschritt des Builds, einen eigenen create-story-Schritt gibt es in 6.13 nicht. Reihenfolge 13-1 -> 13-2 -> 13-3 -> 13-4 -> 13-5 -> 13-6..13-9 (kritischer Pfad im Epic-File). Free-Tier = DeepSeek+Groq (entschieden). Jede Story traegt VOR dem Bau ihren H+-Weg (Herstellbarkeit auf Andis Geraet) oder den festgehaltenen Weg 2. ODER bestehende Kandidaten: 9-8 Long-Press-Menue (epic-9 in-progress), 8-6/8-7, STORY-CANDIDATE Model-Picker / Failed-Inbox / Woerterbuch-Umbau. Lizenzwahl (BSL/PolyForm) und Bau-Freigaben NIE auto-entscheiden. | PARKED, nicht empfehlen: 8-3/8-4 superseded, 12-3; 9-6 GESTRICHEN; C13 Statistik-Port (M), G3b Android-Local-Cleanup-Bau (L), A3/F2 Feature-Frage = Kandidaten ohne Freigabe. Epics 1-8, 10, 11, 12 done, alle Retros done; epic-9 in-progress mit genau 9-8 offen; epic-13 backlog mit 9 Stories. | FALLE: bmad-build setzt beim Start den Story-Key und hebt epic-13 selbst von backlog auf in-progress; bmad-build-auto schreibt sprint-status NICHT -- dort bucht der Conductor. Kein Auto-Send auf Android (entschieden).",
]
