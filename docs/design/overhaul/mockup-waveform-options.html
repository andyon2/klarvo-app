<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waveform-Platzierung — Varianten A–D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --k-bg-deep:#0A0B0C; --k-bg:#0F1112; --k-surface:#16181A; --k-surface-2:#1B1E20;
    --k-elevated:#232729; --k-border:#282C2F; --k-border-2:#353A3E; --k-hairline:rgba(255,255,255,.055);
    --k-text:#ECEEEF; --k-muted:#A4A9AC; --k-dim:#6F7479;
    --k-teal:#29C7AC; --k-teal-hi:#57DDC7; --k-teal-lo:#1B9C88; --k-on-teal:#05201B;
    --k-amber:#E9A24C; --k-amber-line:rgba(233,162,76,.32); --k-danger:#EE6F63; --k-danger-bg:rgba(238,111,99,.12);
    --k-glass:inset 0 1px 0 var(--k-hairline); --k-e3:0 12px 32px rgba(0,0,0,.55);
    --k-font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --k-mono:'Geist Mono',ui-monospace,monospace;
    --k-ease:cubic-bezier(.2,0,0,1); --k-spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#070809;color:var(--k-text);font-family:var(--k-font);line-height:1.55}
  header{position:sticky;top:0;z-index:9;background:#070809ee;border-bottom:1px solid var(--k-border);padding:15px 22px;backdrop-filter:blur(6px)}
  header h1{margin:0 0 3px;font-size:19px} header .meta{color:var(--k-muted);font-size:13px}
  .wrap{max-width:980px;margin:0 auto;padding:22px}
  .lead{color:var(--k-muted);font-size:14px;margin:0 0 22px} .lead b{color:var(--k-teal)}

  /* phone (recording only) */
  .phone{width:266px;background:var(--k-bg);border:1px solid var(--k-border);border-radius:30px;overflow:hidden;box-shadow:var(--k-e3);position:relative}
  .screen{display:flex;flex-direction:column;height:430px;position:relative}
  .statusbar{display:flex;justify-content:space-between;padding:9px 18px 4px;font-size:11px;color:var(--k-dim);font-family:var(--k-mono)}
  .thread{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
  .msg.in{max-width:82%;background:var(--k-surface-2);color:var(--k-text);align-self:flex-start;padding:9px 12px;border-radius:13px;border-bottom-left-radius:4px;font-size:12.5px;line-height:1.5}
  .panel{flex:none;background:rgba(18,20,22,.98);border-top:1px solid var(--k-amber-line);box-shadow:0 -10px 26px rgba(0,0,0,.4);padding:9px 16px 18px;display:flex;flex-direction:column;gap:11px;min-height:172px}
  .grip{width:34px;height:4px;border-radius:999px;background:var(--k-border-2);align-self:center}
  .bar-top{display:flex;align-items:center;gap:9px}
  .kmark{width:18px;height:18px;border-radius:5px;background:linear-gradient(150deg,var(--k-teal-hi),var(--k-teal-lo));color:var(--k-on-teal);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .bar-top .lab{font-size:11.5px;color:var(--k-dim);font-family:var(--k-mono)}
  .bar-top .tm{margin-left:auto;font-family:var(--k-mono);font-size:13px;color:var(--k-muted)}
  .ptext{font-family:var(--k-mono);font-size:13px;line-height:1.7;color:var(--k-muted);flex:1}
  .caret{display:inline-block;width:2px;height:15px;background:var(--k-amber);margin-left:1px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pfoot{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--k-dim)}
  .pfoot svg{width:13px;height:13px;flex:none}

  /* cluster (column container; buttons in a row) */
  .dock{position:absolute;right:14px;bottom:184px;z-index:6}
  .cluster{display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px;border-radius:20px;box-shadow:0 0 0 1.5px var(--k-amber-line);background:rgba(20,22,24,.55)}
  .crow{display:flex;gap:11px;align-items:center}
  .bub{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.5),var(--k-glass);border:0}
  .bub.send{background:linear-gradient(150deg,var(--k-teal-hi),var(--k-teal-lo));color:var(--k-on-teal)}
  .bub.cancel{background:var(--k-danger-bg);border:1px solid var(--k-danger);color:var(--k-danger)}
  .bub svg{width:22px;height:22px}

  /* waveform bars */
  .wave{display:flex;align-items:flex-end;gap:3px}
  .wave i{width:3px;height:5px;background:var(--k-amber);border-radius:2px;animation:wv .85s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:.12s} .wave i:nth-child(3){animation-delay:.26s}
  .wave i:nth-child(4){animation-delay:.38s} .wave i:nth-child(5){animation-delay:.18s}
  .wave i:nth-child(6){animation-delay:.30s} .wave i:nth-child(7){animation-delay:.08s}
  @keyframes wv{0%,100%{height:5px}50%{height:var(--wh,16px)}}
  .wave.h{height:16px}
  .wave.thin{height:11px;--wh:11px}
  .wave.vmid{height:40px;align-items:center;--wh:30px}
  .wave.vmid i{align-self:center}

  /* annotation */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
  .opt{background:var(--k-surface);border:1px solid var(--k-border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center}
  .opt h3{margin:0 0 2px;font-size:15px;align-self:flex-start} .opt h3 b{color:var(--k-amber)}
  .opt .pc{font-size:12px;color:var(--k-muted);align-self:flex-start;margin:0 0 12px}
  .stagebox{background:#0a0c0d;border:1px solid var(--k-border);border-radius:12px;padding:10px 0;overflow:hidden;width:100%;display:flex;justify-content:center}
  .stagebox .phone{zoom:.62}
  @supports not (zoom:1){ .stagebox .phone{transform:scale(.62);transform-origin:top center} .stagebox{height:280px} }
  textarea{width:100%;background:var(--k-bg);color:var(--k-text);border:1px solid var(--k-border);border-radius:9px;padding:10px 12px;font:14px/1.5 var(--k-font);resize:vertical;margin-top:12px}
  textarea:focus{outline:2px solid var(--k-teal);border-color:transparent}
  .pick{display:flex;align-items:center;gap:7px;align-self:flex-start;margin-top:10px;font-size:13px;color:var(--k-muted);cursor:pointer}
  .bar{position:sticky;bottom:0;background:linear-gradient(#07080900,#070809 35%);padding:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .bar button{background:var(--k-teal);color:var(--k-on-teal);border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;font-family:var(--k-font)}
  .bar button.ghost{background:var(--k-surface-2);color:var(--k-text);border:1px solid var(--k-border-2)}
  .savednote{color:var(--k-dim);font-size:12px;text-align:center;padding:2px}
</style></head>
<body>
<header>
  <h1>Waveform-Platzierung — Varianten A–D</h1>
  <div class="meta">Nur der recording-Zustand. Welche Position wirkt als EIN Bauteil statt loses Anhängsel?</div>
</header>
<div class="wrap">
  <p class="lead">Vier Wege, die Live-Waveform unterzubringen, ohne dass das Panel unruhig wird. Wähle eine
  (oder kombiniere/kommentiere) — <b>danach</b> baue ich nur noch die gewählte sauber aus.</p>
  <div class="grid" id="grid"></div>
</div>
<div class="bar">
  <button id="export">⬇ Auswahl + Anmerkung exportieren</button>
  <button class="ghost" id="copymd">📋 Als Markdown kopieren</button>
</div>
<div class="savednote" id="savednote"></div>

<script>
const SEND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>';
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const KBD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="11" rx="2"/><path d="m8 19 4 3 4-3"/></svg>';
const bars=(n)=> '<div class="wave h">'+'<i></i>'.repeat(n)+'</div>';
const barsV=(n)=> '<div class="wave vmid">'+'<i></i>'.repeat(n)+'</div>';
const barsThin=(n)=> '<div class="wave h thin">'+'<i></i>'.repeat(n)+'</div>';

function cluster(variant){
  const send=`<button class="bub send">${SEND}</button>`, cancel=`<button class="bub cancel">${X}</button>`;
  if(variant==='A') return `<div class="cluster">${bars(5)}<div class="crow">${send}${cancel}</div></div>`;
  if(variant==='B') return `<div class="cluster"><div class="crow">${send}${barsV(5)}${cancel}</div></div>`;
  if(variant==='C') return `<div class="cluster"><div class="crow">${send}${cancel}</div></div>`; // wave goes to panel
  if(variant==='D') return `<div class="cluster"><div class="crow">${send}${cancel}</div>${barsThin(7)}</div>`;
}
function phone(variant){
  const panelWave = variant==='C' ? `<span class="wave h" style="margin-left:2px">${'<i></i>'.repeat(5)}</span>` : '';
  return `<div class="phone"><div class="screen" data-v="${variant}">
    <div class="statusbar"><span>16:08</span><span>VPN · 67%</span></div>
    <div class="thread"><div class="msg in">Kannst du mir die Punkte aus dem Call kurz zusammenfassen?</div></div>
    <div class="panel">
      <div class="grip"></div>
      <div class="bar-top"><span class="kmark">K</span><span class="lab">Aufnahme</span>${panelWave}<span class="tm">0:06</span></div>
      <div class="ptext">also wir haben drei sachen besprochen erstens das budget<span class="caret"></span></div>
      <div class="pfoot">${KBD}Tastatur pausiert · kehrt beim Einfügen zurück</div>
    </div>
    <div class="dock">${cluster(variant)}</div>
  </div></div>`;
}

const OPTS=[
  {v:'A',title:'A — <b>Aufsatz</b>',pc:'Waveform als schmale Leiste oben auf dem Cluster — Cluster + Waveform = ein Bauteil.'},
  {v:'B',title:'B — <b>Dazwischen</b>',pc:'Waveform mittig zwischen Senden und Abbrechen. Kompakt, der Live-Puls sitzt zwischen den Aktionen.'},
  {v:'C',title:'C — <b>Im Panel</b>',pc:'Waveform klein neben „Aufnahme/Zeit" im Panel; Cluster ganz ruhig. Nur das Panel bewegt sich dezent.'},
  {v:'D',title:'D — <b>Grundlinie</b>',pc:'Waveform als dünne Linie unter den Buttons — wie ein Audio-Level am Fuß des Clusters.'},
];
const grid=document.getElementById('grid');
OPTS.forEach(o=>{
  const el=document.createElement('section');el.className='opt';el.dataset.v=o.v;
  el.innerHTML=`<h3>${o.title}</h3><p class="pc">${o.pc}</p>
    <div class="stagebox">${phone(o.v)}</div>
    <label class="pick"><input type="radio" name="choice" value="${o.v}"> diese Variante bevorzugen</label>
    <textarea data-key="${o.v}" rows="2" placeholder="Anmerkung zu ${o.v}…"></textarea>`;
  grid.appendChild(el);
});

const SK='klarvo-waveform-opts';
function save(){const d={choice:(document.querySelector('input[name=choice]:checked')||{}).value||''};
  document.querySelectorAll('textarea').forEach(t=>d[t.dataset.key]=t.value);
  localStorage.setItem(SK,JSON.stringify(d));
  document.getElementById('savednote').textContent='gespeichert '+new Date().toLocaleTimeString('de-DE');}
function load(){try{const d=JSON.parse(localStorage.getItem(SK)||'{}');
  document.querySelectorAll('textarea').forEach(t=>{if(d[t.dataset.key])t.value=d[t.dataset.key];});
  if(d.choice){const r=document.querySelector('input[value="'+d.choice+'"]');if(r)r.checked=true;}}catch(e){}}
document.addEventListener('input',save);
function collect(){const choice=(document.querySelector('input[name=choice]:checked')||{}).value||'(keine gewählt)';
  const notes=[...document.querySelectorAll('textarea')].map(t=>({v:t.dataset.key,val:t.value.trim()})).filter(n=>n.val);
  return {choice,notes};}
document.getElementById('export').onclick=()=>{const {choice,notes}=collect();
  const body='<h2>Gewählt: '+choice+'</h2>'+notes.map(n=>'<p><b>'+n.v+':</b> '+n.val.replace(/</g,'&lt;')+'</p>').join('');
  const doc='<!doctype html><meta charset=utf-8><title>Waveform-Auswahl</title>'+
    '<style>body{font:16px system-ui;max-width:760px;margin:24px auto;padding:0 16px;background:#0b0f0e;color:#e7efee}h1{font-size:20px}h2{color:#29c7ac}</style>'+
    '<h1>Waveform-Platzierung — Auswahl</h1><p>'+new Date().toLocaleString('de-DE')+'</p>'+body;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download='waveform-auswahl.html';a.click();};
document.getElementById('copymd').onclick=async()=>{const {choice,notes}=collect();
  const md='**Gewählt: '+choice+'**\n\n'+notes.map(n=>'- '+n.v+': '+n.val).join('\n');
  try{await navigator.clipboard.writeText(md);alert('Kopiert.');}catch(e){prompt('Kopieren:',md);}};
load();
</script>
</body></html>
