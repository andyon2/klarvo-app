[package]
name = "klarvo-audio-cpal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Compiles unconditionally on all platforms; cfg(target_os) selection for
# shell-consumer wiring deferred to Epic 3 (ADR-0006 Amendment 2).
[dependencies]
klarvo-core = { path = "../klarvo-core" }
cpal = { workspace = true }
rubato = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
klarvo-core = { path = "../klarvo-core" }
# approx 0.5 for floating-point equality assertions in resampler tests
approx = "0.5"
