[package]
name = "klarvo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["stage-passthrough", "stage-stt", "stage-cleanup", "v1-import", "settings", "history"]
stage-passthrough = []
stage-stt = []
stage-cleanup = []
v1-import = ["dep:rusqlite"]
dev-plain-keystore = ["dep:rusqlite"]
settings = ["dep:rusqlite"]
history = ["dep:rusqlite"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
specta = { workspace = true }
tokio = { workspace = true }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rusqlite = { workspace = true, optional = true }
secrecy.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
klarvo-plugin-verbatim = { path = "../klarvo-plugins/klarvo-plugin-verbatim" }
klarvo-test-fixtures = { path = "../klarvo-test-fixtures" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[lints.clippy]
disallowed_methods = "deny"

[target.'cfg(target_os = "windows")'.dev-dependencies]
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
