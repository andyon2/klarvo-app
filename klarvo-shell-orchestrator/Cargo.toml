[package]
name = "klarvo-shell-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Klarvo session orchestrator — Tauri-free push-to-talk state machine (ADR-0012)"

[dependencies]
klarvo-core = { path = "../klarvo-core" }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[lints.clippy]
disallowed_methods = "deny"

[dev-dependencies]
klarvo-test-fixtures = { path = "../klarvo-test-fixtures" }
klarvo-plugin-verbatim = { path = "../klarvo-plugins/klarvo-plugin-verbatim" }
tokio = { workspace = true, features = ["test-util", "time"] }
