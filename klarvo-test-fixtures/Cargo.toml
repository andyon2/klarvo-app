[package]
name = "klarvo-test-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["stage-passthrough", "stage-stt", "stage-cleanup"]
stage-passthrough = ["klarvo-core/stage-passthrough"]
stage-stt = ["klarvo-core/stage-stt"]
stage-cleanup = ["klarvo-core/stage-cleanup"]

[dependencies]
klarvo-core = { path = "../klarvo-core" }
async-trait.workspace = true
tokio = { workspace = true, features = ["time"] }
# wiremock is a regular dep (not dev-dep) because GroqMockServer is part of the
# public test-fixture API consumed by external crates' integration tests.
wiremock = "0.6"
secrecy = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
klarvo-plugin-verbatim = { path = "../klarvo-plugins/klarvo-plugin-verbatim" }
tokio = { workspace = true, features = ["macros", "rt"] }
