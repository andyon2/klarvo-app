[package]
name = "klarvo-windows-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Klarvo Windows desktop shell (Tauri v2)"

[lib]
name = "klarvo_windows_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "klarvo-windows-shell"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
klarvo-core = { path = "../../../klarvo-core" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
klarvo-audio-cpal = { path = "../../../klarvo-audio-cpal" }
