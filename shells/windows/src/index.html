<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klarvo</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0d0f14;
        color: #e0e4ef;
        min-height: 100vh;
      }
      #root { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
      .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid #2a3040; }
      .tab-btn {
        padding: 8px 16px; background: none; border: none; border-bottom: 2px solid transparent;
        color: #8090a0; font-size: 14px; font-weight: 500; cursor: pointer;
        margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;
      }
      .tab-btn:hover { color: #e0e4ef; }
      .tab-btn.active { color: #2ac3a8; border-bottom-color: #2ac3a8; }
      .field { margin-bottom: 16px; }
      label { display: block; font-size: 12px; color: #8090a0; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
      input, select {
        width: 100%; padding: 8px 12px;
        background: #1a1e28; border: 1px solid #2a3040;
        border-radius: 8px; color: #e0e4ef;
        font-size: 14px; outline: none;
        transition: border-color 0.15s;
      }
      input:focus, select:focus { border-color: #2ac3a8; }
      button {
        padding: 8px 20px; border-radius: 8px; border: none;
        font-size: 14px; font-weight: 500; cursor: pointer;
        transition: opacity 0.15s;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .btn-primary { background: #2ac3a8; color: #0d0f14; }
      .btn-primary:hover:not(:disabled) { opacity: 0.85; }
      .actions { margin-top: 24px; display: flex; gap: 10px; align-items: center; }
      .spinner {
        display: inline-block; width: 18px; height: 18px;
        border: 2px solid #2a3040; border-top-color: #2ac3a8;
        border-radius: 50%; animation: spin 0.6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .toast { padding: 10px 14px; border-radius: 8px; font-size: 13px; }
      .toast.ok  { background: #1a3028; color: #2ac3a8; border: 1px solid #2ac3a830; }
      .toast.err { background: #2e1414; color: #ff7369; border: 1px solid #ff736930; }
      .loading-row { display: flex; align-items: center; gap: 8px; color: #8090a0; font-size: 14px; }
      .entry-row {
        display: flex; align-items: flex-start; gap: 10px;
        padding: 10px 0; border-bottom: 1px solid #1a1e28;
      }
      .entry-meta { font-size: 12px; color: #8090a0; flex-shrink: 0; width: 130px; }
      .entry-text { flex: 1; font-size: 13px; color: #e0e4ef; word-break: break-word; }
      .btn-danger {
        padding: 4px 10px; border-radius: 6px; border: 1px solid #3a1e1e;
        background: #2e1414; color: #ff7369; font-size: 12px; cursor: pointer;
        flex-shrink: 0; transition: opacity 0.15s;
      }
      .btn-danger:hover:not(:disabled) { opacity: 0.75; }
      .btn-danger:disabled { opacity: 0.5; cursor: default; }
      .btn-secondary {
        background: #1e2535; color: #c0c8d8; border: 1px solid #2a3040;
        padding: 8px 16px; border-radius: 6px; font-size: 13px;
        cursor: pointer; transition: background 0.15s;
      }
      .btn-secondary:hover:not(:disabled) { background: #252d40; }
      .btn-secondary:disabled { opacity: 0.5; cursor: default; }
      .empty-state { text-align: center; padding: 40px 20px; color: #8090a0; }
      .empty-state p { font-size: 14px; margin-bottom: 8px; }
      .empty-hint { font-size: 12px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      // React 19 via ESM CDN — no build step for this Phase-2-A minimal panel.
      // Phase-2-B migrates to a full Vite+React workspace once the UI expands.
      import { createElement as h, useState, useEffect, useCallback, useRef } from "https://esm.sh/react@19";
      import { createRoot } from "https://esm.sh/react-dom@19/client";

      // ---------------------------------------------------------------------------
      // Tauri IPC
      // ---------------------------------------------------------------------------

      const tauriCore = window.__TAURI__?.core ?? null;
      const tauriEvent = window.__TAURI__?.event ?? null;

      async function invoke(cmd, args) {
        if (!tauriCore) throw new Error("Tauri runtime not found");
        return tauriCore.invoke(cmd, args);
      }

      // AppError serialised with #[serde(rename_all = "camelCase")] →
      // { kind, message, userMessage, retryable }. `userMessage` carries the
      // i18n-key for the toast. We never fall back to the technical `message`
      // (Rust-side, often "settings db: write …: locked") because that leaks
      // implementation details to the user; an unknown shape becomes the
      // i18n-key `error.unknown` so the toast layer can translate it.
      function errorToToast(e) {
        if (e && typeof e === "object" && typeof e.userMessage === "string" && e.userMessage) {
          return { kind: "err", msg: e.userMessage };
        }
        return { kind: "err", msg: "error.unknown" };
      }

      // ---------------------------------------------------------------------------
      // SettingsPanel — AC-8 (load) + AC-9 (save)
      // ---------------------------------------------------------------------------

      // Phase-1 defaults — kept in sync with klarvo-core/src/settings/defaults.rs.
      // Used as a Fresh-Install fallback when get_user_settings cannot reach the
      // backend (Code-Review P11).
      const FORM_DEFAULTS = {
        hotkeySlot1Combo: "Alt+Shift+R",
        outputTargetId: "clipboard",
        uiLanguage: "en",
        dictionaryLanguage: "en",
        outputLanguage: "en",
        hotkeySlot1Mode: "hold",
        hotkeySlot2Combo: "",   // null/undefined from backend → empty string
        hotkeySlot2Mode: "hold",
      };

      const RECORDING_MODE_OPTIONS = [
        { value: "hold",          label: "Hold to Talk" },
        { value: "toggle",        label: "Toggle" },
        { value: "autostop",      label: "Auto-Stop" },
        { value: "wait_and_type", label: "Wait & Type" },
      ];

      const LANG_OPTIONS = [
        { value: "en", label: "English" },
        { value: "de", label: "Deutsch" },
      ];

      // P10: render the backend value even when it falls outside the curated
      // LANG_OPTIONS list (e.g. a v1-imported "fr") instead of silently
      // showing an empty <select>.
      function langOptionsFor(currentValue) {
        if (!currentValue || LANG_OPTIONS.some((o) => o.value === currentValue)) {
          return LANG_OPTIONS;
        }
        return [...LANG_OPTIONS, { value: currentValue, label: currentValue }];
      }

      function SettingsPanel() {
        const [loading, setLoading] = useState(true);
        const [saving, setSaving] = useState(false);
        const [exporting, setExporting] = useState(false);
        const [toast, setToast] = useState(null); // { kind: "ok" | "err", msg: string }
        const [form, setForm] = useState(FORM_DEFAULTS);
        // D-2 conflict-validation state: true when slot2 combo === slot1 combo (non-empty)
        const [slot2Conflict, setSlot2Conflict] = useState(false);
        // P14 (Code-Review-Closure 2026-05-05): the previous persistent inline
        // "Active after restart" hint was replaced by a one-shot success toast
        // emitted from handleSave when the slot-2 combo actually changed.
        // No state needed for the toast — it rides on the existing setToast queue.
        // P6 (subsumed by P14): compare loaded slot-2 combo to form value at save
        // time to decide whether the toast fires. The loaded value is captured at
        // get_user_settings-resolution and never updated again until the next
        // backend reload (effectively "what's persisted on disk right now").
        const loadedSlot2ComboRef = useRef(null);

        // ADR-0009 Hybrid-C: subscribe to global app.error so backend-emitted
        // errors (config-parse, settings-fallback, hotkey-conflict, …) surface
        // through the same toast UI as local invoke-failures. The frontend has
        // no full i18n loader yet (Phase-2-B Vite+React migration), so the
        // received key is rendered verbatim — translation lands with the
        // toolchain rebuild.
        useEffect(() => {
          if (!tauriEvent) return;
          // Cancellation-flag pattern: tauriEvent.listen() returns a Promise
          // that resolves with the unlisten function. If the component
          // unmounts before the Promise resolves, we must not stash the
          // resolver into a stale ref — and we must invoke it as soon as it
          // arrives so the listener does not leak and write into unmounted
          // state.
          let cancelled = false;
          let unlisten = null;
          tauriEvent
            .listen("app:error", (evt) => {
              const payload = evt?.payload;
              const key =
                typeof payload === "string"
                  ? payload
                  : (payload && typeof payload.key === "string" ? payload.key : "error.unknown");
              setToast({ kind: "err", msg: key });
            })
            .then((fn) => {
              if (cancelled) {
                fn();
              } else {
                unlisten = fn;
              }
            })
            .catch((err) => {
              if (typeof console !== "undefined") {
                console.warn("[settings-panel] app.error listen failed", err);
              }
            });
          return () => {
            cancelled = true;
            if (unlisten) unlisten();
          };
        }, []);

        // AC-8: load on mount — no flash of empty content (loading spinner while async runs)
        useEffect(() => {
          invoke("get_user_settings")
            .then((s) => {
              setForm({
                hotkeySlot1Combo: s.hotkeySlot1Combo ?? FORM_DEFAULTS.hotkeySlot1Combo,
                outputTargetId: s.outputTargetId ?? FORM_DEFAULTS.outputTargetId,
                uiLanguage: s.uiLanguage ?? FORM_DEFAULTS.uiLanguage,
                dictionaryLanguage: s.dictionaryLanguage ?? FORM_DEFAULTS.dictionaryLanguage,
                outputLanguage: s.outputLanguage ?? FORM_DEFAULTS.outputLanguage,
                hotkeySlot1Mode: s.hotkeySlot1Mode ?? FORM_DEFAULTS.hotkeySlot1Mode,
                hotkeySlot2Combo: s.hotkeySlot2Combo ?? "",
                hotkeySlot2Mode: s.hotkeySlot2Mode ?? FORM_DEFAULTS.hotkeySlot2Mode,
              });
              // P6/P14: snapshot the persisted slot-2 combo so handleSave can detect
              // an actual change vs. a save where slot-2 is untouched.
              loadedSlot2ComboRef.current = s.hotkeySlot2Combo ?? null;
            })
            .catch((e) => {
              // P11: keep the form populated with Phase-1 defaults so AC-8
              // ("kein blank/undefined") holds even when the IPC call fails.
              setForm(FORM_DEFAULTS);
              setToast(errorToToast(e));
            })
            .finally(() => setLoading(false));
        }, []);

        // AC-10: settings.changed listener — keep dropdown in sync when mode changes
        // from other sources (e.g. future CLI or another shell instance).
        useEffect(() => {
          if (!tauriEvent) return;
          let cancelled = false;
          let unlisten = null;
          tauriEvent
            .listen("settings.changed", (evt) => {
              const payload = evt?.payload;
              if (payload && payload.key === "hotkey.slot1.mode" && typeof payload.newValue === "string") {
                setForm((f) => ({ ...f, hotkeySlot1Mode: payload.newValue }));
              }
            })
            .then((fn) => {
              if (cancelled) fn();
              else unlisten = fn;
            })
            .catch(() => {});
          return () => {
            cancelled = true;
            if (unlisten) unlisten();
          };
        }, []);

        // Story 2.A.C3 AC-3 + AC-5: live-locale-switch — reload backend i18n_table on
        // ui.language change. Axis-1 only: other settings.changed keys are ignored (AC-5).
        const lastAppliedLocaleRef = useRef(null);
        useEffect(() => {
          if (!tauriEvent) return;
          let cancelled = false;
          let unlisten = null;
          tauriEvent
            .listen("settings.changed", (evt) => {
              const payload = evt?.payload;
              // AC-5: filter exclusively on "ui.language" — do not react to axis-2/axis-3 keys.
              if (!payload || payload.key !== "ui.language" || typeof payload.newValue !== "string") {
                return;
              }
              // De-dup: skip when the same locale fires twice (e.g. settings replay or
              // migration storm). Update the ref before the invoke so a concurrent retry
              // collapses to one IPC.
              if (payload.newValue === lastAppliedLocaleRef.current) return;
              lastAppliedLocaleRef.current = payload.newValue;
              // AC-3: trigger backend reload. Backend warns on unknown locale; surface
              // transport / serialization / future AppError variants via console.warn
              // so silent IPC failures are at least observable in devtools.
              invoke("reload_locale", { lang: payload.newValue }).catch((e) => {
                console.warn("reload_locale failed:", e);
              });
            })
            .then((fn) => {
              if (cancelled) fn();
              else unlisten = fn;
            })
            .catch((e) => {
              console.warn("settings.changed listen failed:", e);
            });
          return () => {
            cancelled = true;
            if (unlisten) unlisten();
          };
        }, []);

        // D-2 conflict check: P8 (Code-Review-Closure 2026-05-05) trims so that
        // leading/trailing whitespace ("Ctrl+Z " vs "Ctrl+Z") cannot bypass the
        // inline UI guard. Backend has its own normalized comparison.
        const checkSlot2Conflict = useCallback((slot2Val) => {
          const trimmed = (slot2Val || "").trim();
          const conflict = trimmed.length > 0 && trimmed === (form.hotkeySlot1Combo || "").trim();
          setSlot2Conflict(conflict);
          return conflict;
        }, [form.hotkeySlot1Combo]);

        // AC-9: save — invoke typed Core-Set commands, show app.error toast on failure
        const handleSave = useCallback(async () => {
          if (slot2Conflict) return; // guard: Save-Button should be disabled, but double-check
          setSaving(true);
          setToast(null);
          // P14 + P6: emit the restart-toast only when slot-2 combo *actually*
          // changed compared to the value loaded from the backend. Pure mode-only
          // changes propagate live via the settings.changed listener and need no
          // restart, so the user shouldn't see the hint for them.
          const newSlot2 = form.hotkeySlot2Combo.length > 0 ? form.hotkeySlot2Combo : null;
          const slot2Changed = newSlot2 !== loadedSlot2ComboRef.current;
          try {
            await invoke("set_hotkey_slot1",         { combo: form.hotkeySlot1Combo });
            await invoke("set_output_target",        { id: form.outputTargetId });
            await invoke("set_ui_language",          { lang: form.uiLanguage });
            await invoke("set_dictionary_language",  { lang: form.dictionaryLanguage });
            await invoke("set_output_language",      { lang: form.outputLanguage });
            await invoke("set_recording_mode_slot1", { mode: form.hotkeySlot1Mode });
            // Slot-2: send null to clear (D-3), or the combo string to set
            await invoke("set_hotkey_slot2", { combo: newSlot2 });
            await invoke("set_recording_mode_slot2", { mode: form.hotkeySlot2Mode });
            // P14: one-shot toast only when the slot-2 combo changed (set, cleared,
            // or replaced). The success-toast queue auto-dismisses, replacing the
            // previous persistent inline-hint that lived until × Clear.
            if (slot2Changed) {
              setToast({ kind: "ok", msg: "Settings saved. Slot-2 hotkey active after restart." });
              // Update the snapshot so a re-save without further changes does not
              // re-fire the restart-toast.
              loadedSlot2ComboRef.current = newSlot2;
            } else {
              setToast({ kind: "ok", msg: "Settings saved." });
            }
          } catch (e) {
            setToast(errorToToast(e));
          } finally {
            setSaving(false);
          }
        }, [form, slot2Conflict]);

        const handleExport = useCallback(async () => {
          setExporting(true);
          setToast(null);
          try {
            const path = await invoke("export_debug_zip_cmd");
            setToast({ kind: "ok", msg: `Exported to: ${path}` });
          } catch (e) {
            setToast(errorToToast(e));
          } finally {
            setExporting(false);
          }
        }, []);

        const patch = (key) => (e) => {
          const val = e.target.value;
          setForm((f) => ({ ...f, [key]: val }));
          // P8/P10 (Code-Review-Closure 2026-05-05): trim and check D-2 conflict
          // reactively on every slot-1 OR slot-2 keystroke (previously slot-2
          // only fired on blur, asymmetric with slot-1's per-keystroke check).
          if (key === "hotkeySlot1Combo") {
            const trimmedSlot1 = (val || "").trim();
            const trimmedSlot2 = (form.hotkeySlot2Combo || "").trim();
            setSlot2Conflict(trimmedSlot2.length > 0 && trimmedSlot1 === trimmedSlot2);
          } else if (key === "hotkeySlot2Combo") {
            const trimmedSlot2 = (val || "").trim();
            const trimmedSlot1 = (form.hotkeySlot1Combo || "").trim();
            setSlot2Conflict(trimmedSlot2.length > 0 && trimmedSlot2 === trimmedSlot1);
          }
        };

        const textField = (label, key) =>
          h("div", { className: "field" },
            h("label", null, label),
            h("input", { type: "text", value: form[key], onChange: patch(key), disabled: loading || saving })
          );

        const selectField = (label, key, options) =>
          h("div", { className: "field" },
            h("label", null, label),
            h("select", { value: form[key], onChange: patch(key), disabled: loading || saving },
              options.map((o) => h("option", { key: o.value, value: o.value }, o.label))
            )
          );

        return h("div", null,
          loading
            ? h("div", { className: "loading-row" },
                h("div", { className: "spinner" }),
                "Loading…"
              )
            : h("form", {
                onSubmit: (e) => {
                  e.preventDefault();
                  // Guard against Enter-key submits while a save is already
                  // in flight — the button is `disabled`, but `<form>` still
                  // reacts to Enter inside text inputs and would race the
                  // first handleSave with potentially-mutated form state.
                  if (saving || loading || exporting) return;
                  handleSave();
                }
              },
              textField("Global Hotkey", "hotkeySlot1Combo"),
              textField("Output Target", "outputTargetId"),
              selectField("UI Language", "uiLanguage", langOptionsFor(form.uiLanguage)),
              selectField("Dictionary Language", "dictionaryLanguage", langOptionsFor(form.dictionaryLanguage)),
              selectField("Output Language", "outputLanguage", langOptionsFor(form.outputLanguage)),
              selectField("Recording Mode", "hotkeySlot1Mode", RECORDING_MODE_OPTIONS),

              // Slot-2 block (Story 8.1)
              h("div", { className: "field" },
                h("label", null, "Second Hotkey"),
                h("div", { style: { display: "flex", gap: 8 } },
                  h("input", {
                    type: "text",
                    value: form.hotkeySlot2Combo,
                    placeholder: "Not set — click to configure",
                    "aria-invalid": slot2Conflict ? "true" : undefined,
                    style: slot2Conflict
                      ? { flex: 1, borderColor: "#ff7369" }
                      : { flex: 1 },
                    onChange: patch("hotkeySlot2Combo"),
                    onBlur: (e) => checkSlot2Conflict(e.target.value),
                    disabled: loading || saving,
                  }),
                  h("button", {
                    type: "button",
                    className: "btn-secondary",
                    style: { padding: "8px 12px", flexShrink: 0 },
                    disabled: loading || saving || form.hotkeySlot2Combo === "",
                    onClick: () => {
                      // P9 (Code-Review-Closure 2026-05-05): reset mode to default
                      // alongside clearing the combo so a stale mode value doesn't
                      // get persisted on the next save (the dropdown becomes disabled
                      // when combo is empty, but `form.hotkeySlot2Mode` would otherwise
                      // retain whatever was last selected and resurface on re-bind).
                      setForm((f) => ({
                        ...f,
                        hotkeySlot2Combo: "",
                        hotkeySlot2Mode: FORM_DEFAULTS.hotkeySlot2Mode,
                      }));
                      setSlot2Conflict(false);
                    },
                    title: "Clear slot-2 hotkey",
                  }, "×")
                ),
                slot2Conflict && h("span", {
                  style: { color: "#ff7369", fontSize: 12, marginTop: 4, display: "block" }
                }, "This shortcut is already used by slot 1."),
              ),
              h("div", { className: "field" },
                h("label", null, "Slot 2 Mode"),
                h("select", {
                  value: form.hotkeySlot2Mode,
                  onChange: patch("hotkeySlot2Mode"),
                  disabled: loading || saving || form.hotkeySlot2Combo === "",
                },
                  RECORDING_MODE_OPTIONS.map((o) => h("option", { key: o.value, value: o.value }, o.label))
                ),
              ),

              h("div", { className: "actions" },
                h("button", { type: "submit", className: "btn-primary", disabled: saving || exporting || slot2Conflict },
                  saving
                    ? h("span", { style: { display: "flex", alignItems: "center", gap: 6 } },
                        h("div", { className: "spinner", style: { width: 14, height: 14 } }),
                        "Saving…"
                      )
                    : "Save Settings"
                )
              ),

              h("div", { className: "actions", style: { marginTop: 12 } },
                h("button", {
                    type: "button",
                    className: "btn-secondary",
                    onClick: handleExport,
                    disabled: exporting || saving || loading,
                  },
                  exporting
                    ? h("span", { style: { display: "flex", alignItems: "center", gap: 6 } },
                        h("div", { className: "spinner", style: { width: 14, height: 14 } }),
                        "Exporting…"
                      )
                    : "Export Debug Log"
                )
              ),

              toast && h("div", { className: `toast ${toast.kind}`, style: { marginTop: 16 } },
                toast.msg
              )
            )
        );
      }

      // ---------------------------------------------------------------------------
      // HistoryPanel — AC-3 (load), AC-4 (entry list), AC-5 (delete), AC-6 (clear all), AC-7 (empty state)
      // ---------------------------------------------------------------------------

      function HistoryPanel() {
        const [loadState, setLoadState] = useState({ status: "idle" });
        const [deletingId, setDeletingId] = useState(null);
        const [clearing, setClearing] = useState(false);
        const [toast, setToast] = useState(null);

        // P2 (review): mounted-ref guards setState calls in async paths from
        // writing into an unmounted component when the user switches tabs
        // while a load/delete/clear-all promise is still in flight.
        const mountedRef = useRef(true);
        useEffect(() => {
          mountedRef.current = true;
          return () => { mountedRef.current = false; };
        }, []);

        // P1 (review): `invoke()` wrapper resolves with the raw Tauri value
        // and rejects with the AppError — analog zu SettingsPanel-Pattern.
        // Es gibt KEIN { status: "ok", data } Envelope auf der Resolve-Seite.
        function loadHistory() {
          setLoadState({ status: "loading" });
          invoke("get_history", { limit: 100 })
            .then((entries) => {
              if (!mountedRef.current) return;
              setLoadState({ status: "success", entries: entries ?? [] });
            })
            .catch((e) => {
              if (!mountedRef.current) return;
              setLoadState({ status: "error", error: e });
              setToast(errorToToast(e));
            });
        }

        useEffect(loadHistory, []);

        async function deleteEntry(id) {
          setDeletingId(id);
          setToast(null);
          try {
            await invoke("delete_history_entry", { id });
            if (!mountedRef.current) return;
            setLoadState((prev) =>
              prev.status === "success"
                ? { ...prev, entries: prev.entries.filter((e) => e.id !== id) }
                : prev
            );
          } catch (e) {
            if (!mountedRef.current) return;
            setToast(errorToToast(e));
          } finally {
            if (mountedRef.current) setDeletingId(null);
          }
        }

        // P5 (review): rename for verb-first action-naming consistency
        // with `loadHistory` (architecture.md:754).
        async function clearHistory() {
          if (!window.confirm("Clear all dictation history? This cannot be undone.")) return;
          setClearing(true);
          setToast(null);
          try {
            await invoke("clear_history");
            if (!mountedRef.current) return;
            setLoadState((prev) =>
              prev.status === "success" ? { ...prev, entries: [] } : prev
            );
          } catch (e) {
            if (!mountedRef.current) return;
            setToast(errorToToast(e));
          } finally {
            if (mountedRef.current) setClearing(false);
          }
        }

        function renderEntries(entries) {
          if (entries.length === 0) {
            return h("div", { className: "empty-state" },
              // P4 (review): no trailing period — matches `history.empty_state.title`.
              h("p", null, "No dictations yet"),
              h("p", { className: "empty-hint" }, "Start dictating with your hotkey — entries appear here.")
            );
          }
          return h("div", null,
            h("div", { style: { display: "flex", justifyContent: "flex-end", marginBottom: 12 } },
              h("button", {
                className: "btn-danger",
                onClick: clearHistory,
                disabled: clearing,
              }, clearing ? "Clearing…" : "Clear All")
            ),
            entries.map((entry) => {
              const preview = entry.text.length > 120
                ? entry.text.slice(0, 120) + "…"
                : entry.text;
              const timestamp = new Date(entry.createdAt).toLocaleString();
              return h("div", { key: entry.id, className: "entry-row" },
                h("div", { className: "entry-meta" },
                  timestamp,
                  entry.style && entry.style !== "verbatim"
                    ? h("span", { style: { marginLeft: 6, fontSize: 11, color: "#2ac3a8" } }, entry.style)
                    : null
                ),
                h("div", { className: "entry-text" }, preview),
                h("button", {
                  className: "btn-danger",
                  onClick: () => deleteEntry(entry.id),
                  disabled: deletingId === entry.id,
                }, "Delete")
              );
            })
          );
        }

        // P3 (review): single dedicated toast slot, independent of loadState
        // branch — avoids the previous two-pronged render with defensive guards.
        return h("div", null,
          toast && h("div", { className: "toast err", style: { marginBottom: 16 } }, toast.msg),
          loadState.status === "loading"
            ? h("div", { className: "loading-row" },
                h("div", { className: "spinner" }),
                "Loading history…"
              )
            : loadState.status === "success"
            ? renderEntries(loadState.entries)
            : null
        );
      }

      // ---------------------------------------------------------------------------
      // App — Tab-Routing (AC-2)
      // ---------------------------------------------------------------------------

      function App() {
        const [activeTab, setActiveTab] = useState("settings");
        return h("div", null,
          h("div", { className: "tabs" },
            h("button", {
              className: `tab-btn ${activeTab === "settings" ? "active" : ""}`,
              onClick: () => setActiveTab("settings"),
            }, "Settings"),
            h("button", {
              className: `tab-btn ${activeTab === "history" ? "active" : ""}`,
              onClick: () => setActiveTab("history"),
            }, "History"),
          ),
          activeTab === "settings" ? h(SettingsPanel, null) : h(HistoryPanel, null)
        );
      }

      createRoot(document.getElementById("root")).render(h(App, null));
    </script>
  </body>
</html>
