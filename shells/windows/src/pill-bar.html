<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%; height: 100%;
    }
    #pill {
      width: 100%; height: 100%;
      background: var(--klarvo-color-overlay-bg);
      border-radius: 24px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      opacity: 1;
      cursor: move;
      transition: opacity var(--klarvo-timing-medium) ease-out;
    }
    #pill.fade-out { opacity: 0; }

    /* CleanupDone: success-edge border at 30% alpha */
    #pill.cleanup-done {
      border-color: color-mix(in srgb, var(--klarvo-color-success) 30%, transparent);
    }
    /* CleanupDone: abort button hidden */
    #pill.cleanup-done #abort-btn { display: none; }

    /* Fade-Pulse animation on lp-text at CleanupDone morph */
    @keyframes lp-morph-pulse {
      0%   { opacity: 1; }
      40%  { opacity: 0.15; }
      100% { opacity: 1; }
    }
    .lp-morph-pulse {
      animation: lp-morph-pulse var(--klarvo-timing-fast) ease;
    }

    /* K-Logo: verbatim v1 KlarvoLogo (24×24 rounded, color: var(--klarvo-color-action), white K) */
    #k-logo {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: var(--klarvo-color-action);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      line-height: 1;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    /* 5-bar waveform container */
    #waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 1;
      height: 28px;
      min-width: 0;
    }

    /* Individual pill-shaped bars — color: var(--klarvo-color-action) (v1 trust-anchor teal) */
    .bar {
      flex: 1;
      border-radius: var(--klarvo-radius-pill);
      background: var(--klarvo-color-action);
      opacity: 0.85;
      height: 4px;
      min-height: 4px;
      max-height: 28px;
      transition: height 40ms linear;
    }

    /* Mode badge: shown right of waveform in recording state */
    #mode-badge {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 500;
      color: var(--klarvo-color-surface-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      user-select: none;
    }

    /* Abort button: v1 StopButton — red square on transparent button */
    #abort-btn {
      width: 22px; height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 2px;
      padding: 0;
    }
    #abort-btn:hover #abort-square {
      opacity: 1;
    }
    #abort-square {
      width: 10px; height: 10px;
      border-radius: 1px;
      background: var(--klarvo-color-danger);
      opacity: 0.85;
    }

    /* Live-Preview layout */
    #pill.live-preview #mode-badge { display: none; }

    /* Recording-State: lp-area ausblenden */
    #lp-area { display: none; }

    /* Live-Preview: waveform ausblenden, lp-area einblenden */
    #pill.live-preview #waveform { display: none; }
    #pill.live-preview #lp-area {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }

    /* Text-Area: fills available space, overflow ellipsis */
    #lp-text {
      flex: 1;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--klarvo-color-text-primary);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: none;
    }

    /* Side-Strip: 8 narrow bars on the right */
    #side-strip {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      height: 28px;
    }
    .sbar {
      width: 3px;
      border-radius: var(--klarvo-radius-pill);
      background: var(--klarvo-color-action);
      opacity: 0.7;
      height: 4px;
      min-height: 4px;
      max-height: 28px;
      transition: height 40ms linear;
    }
  </style>
</head>
<body>
  <div id="pill" data-tauri-drag-region>
    <!-- K-Logo: verbatim aus v1 KlarvoLogo component (FloatingBar.tsx) -->
    <div id="k-logo">K</div>

    <!-- 5 Pill-shaped Waveform-Bars (v1 BAR_COUNT=5, borderRadius:9999) -->
    <div id="waveform">
      <div class="bar" data-idx="0"></div>
      <div class="bar" data-idx="1"></div>
      <div class="bar" data-idx="2"></div>
      <div class="bar" data-idx="3"></div>
      <div class="bar" data-idx="4"></div>
    </div>

    <!-- Mode badge: shows current recording mode -->
    <span id="mode-badge">Hold</span>

    <!-- Abort button: verbatim aus v1 StopButton component -->
    <button id="abort-btn" title="Cancel recording" aria-label="Cancel recording">
      <div id="abort-square"></div>
    </button>

    <!-- Live-Preview content: wired by Story 11.4 -->
    <div id="lp-area">
      <div id="lp-text" role="status" aria-live="polite"></div>
      <div id="side-strip">
        <div class="sbar" data-idx="0"></div>
        <div class="sbar" data-idx="1"></div>
        <div class="sbar" data-idx="2"></div>
        <div class="sbar" data-idx="3"></div>
        <div class="sbar" data-idx="4"></div>
        <div class="sbar" data-idx="5"></div>
        <div class="sbar" data-idx="6"></div>
        <div class="sbar" data-idx="7"></div>
      </div>
    </div>
  </div>
  <script type="module">
    const tauriCore  = window.__TAURI__?.core  ?? null;
    const tauriEvent = window.__TAURI__?.event ?? null;

    const pill      = document.getElementById('pill');
    const abortBtn  = document.getElementById('abort-btn');
    const bars      = Array.from(document.querySelectorAll('.bar'));
    const lpText    = document.getElementById('lp-text');
    const sbars     = Array.from(document.querySelectorAll('.sbar'));

    const BIN_COUNT  = 64;
    const BAR_COUNT  = 5;
    const SBAR_COUNT = 8;

    // bins: full 64-element snapshot from the last waveform_tick
    let bins = new Float32Array(BIN_COUNT);

    // Map 64 bins → 5 bars by sampling evenly-spaced indices (matches v1's approach
    // from FloatingBar.tsx: levelIdx = Math.round(i/(BAR_COUNT-1)*(levels.length-1)))
    function updateBars() {
      for (let i = 0; i < BAR_COUNT; i++) {
        const binIdx = Math.round(i / (BAR_COUNT - 1) * (BIN_COUNT - 1));
        const amplitude = Math.max(0.12, bins[binIdx] ?? 0);
        const heightPx = Math.round(amplitude * 28);
        bars[i].style.height = `${heightPx}px`;
      }
    }

    function updateSbars() {
      for (let i = 0; i < SBAR_COUNT; i++) {
        const binIdx = Math.round(i / (SBAR_COUNT - 1) * (BIN_COUNT - 1));
        const amplitude = Math.max(0.08, bins[binIdx] ?? 0);
        const heightPx = Math.round(amplitude * 28);
        sbars[i].style.height = `${heightPx}px`;
      }
    }

    // Initial idle state: all bars at minimum height
    updateBars();
    updateSbars();

    // Abort button: invoke cancel_recording Tauri command
    abortBtn.addEventListener('click', () => {
      if (!tauriCore) return;
      tauriCore.invoke('cancel_recording').catch((e) => {
        console.error('[pill-bar] cancel_recording failed:', e);
      });
    });

    if (tauriEvent) {
      // Waveform tick: update bins + redraw 5 bars
      tauriEvent.listen('pill_bar:waveform_tick', (evt) => {
        const payload = evt?.payload;
        if (payload && Array.isArray(payload.bins)) {
          const incoming = payload.bins;
          const limit = Math.min(BIN_COUNT, incoming.length);
          for (let i = 0; i < limit; i++) {
            const v = incoming[i];
            bins[i] = Number.isFinite(v) ? v : 0;
          }
          for (let i = limit; i < BIN_COUNT; i++) {
            bins[i] = 0;
          }
          updateBars();
          updateSbars();
        }
      });

      // Show: clear fade-out + live-preview + cleanup-done classes, reset bars
      tauriEvent.listen('pill_bar:show', () => {
        pill.classList.remove('fade-out');
        pill.classList.remove('live-preview');
        pill.classList.remove('cleanup-done');
        lpText.textContent = '';
        bins.fill(0);
        updateBars();
        updateSbars();
      });

      // Fade-out: CSS transition; Rust hides window after 300ms (FADE_OUT_MS constant)
      tauriEvent.listen('pill_bar:fade_out', () => {
        pill.classList.add('fade-out');
      });

      // Live-Preview: resize already done by Rust before this event fires
      tauriEvent.listen('pill_bar:enter_live_preview', () => {
        pill.classList.add('live-preview');
      });

      // Live-Preview chunk: update text area
      tauriEvent.listen('pill_bar:live_preview_chunk', (evt) => {
        const payload = evt?.payload;
        if (payload && typeof payload.text === 'string') {
          lpText.textContent = payload.text;
        }
      });

      // CleanupDone: morph to success state with fade-pulse animation
      tauriEvent.listen('pill_bar:cleanup_done', (evt) => {
        const payload = evt?.payload;
        if (payload && typeof payload.text === 'string') {
          lpText.textContent = payload.text;
          // Retrigger animation (handles rapid successive calls)
          lpText.classList.remove('lp-morph-pulse');
          void lpText.offsetWidth;  // force reflow to restart CSS animation
          lpText.classList.add('lp-morph-pulse');
          pill.classList.add('cleanup-done');
        }
      });
    }
  </script>
</body>
</html>
