[package]
name = "klarvo"
version = "0.5.0"
description = "Free voice dictation with AI text cleanup"
authors = ["Andy"]
edition = "2021"

[[bin]]
name = "klarvo"
path = "src/main.rs"

[lib]
name = "klarvo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
log = "0.4"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
base32 = "0.4"
base64 = "0.22"

# Desktop-only dependencies (not available on Android/iOS)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
cpal = "0.15"
arboard = "3"
voice_activity_detector = "0.2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
] }

# Android-only: JNI bridge for the overlay service (LocalWhisperInference Kotlin class).
# once_cell provides the global model cache; jni exposes Rust functions to the JVM.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
once_cell = "1"

# whisper-rs: offline STT fallback (CPU-only by default; CUDA support is an
# optional feature flag for later). Enabled on Windows and Android:
# - Windows: primary offline STT path via the hotkey pipeline
# - Android: KlarvoApi.kt calls the transcribe_local Tauri command instead of Groq HTTP
# - Linux/macOS: not yet supported in production, cmake may not be available
[target.'cfg(any(windows, target_os = "android"))'.dependencies.whisper-rs]
version = "0.15.1"

# Local LLM inference (offline cleanup fallback via llama.cpp).
# Windows-only (same reason as whisper-rs: bindgen needs libclang + CMake).
# Static linking -- ggml symbol duplicates with whisper-rs-sys are resolved
# by /FORCE:MULTIPLE in .cargo/config.toml.
[target.'cfg(windows)'.dependencies.llama-cpp-2]
version = "0.1.140"

[target.'cfg(windows)'.dependencies.encoding_rs]
version = "0.8"

[dev-dependencies]
tempfile = "3"
insta = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
